version = 1
name = "@glide/web"

[setup]
script = '''
set -euo pipefail

WORKSPACE_DIR="${CODEX_WORKTREE_PATH:-$PWD}"

if [ "${CODEX_INTERNAL_ORIGINATOR_OVERRIDE:-}" = "Codex Desktop" ]; then
  export CODEX_HOME="${HOME}/.codex-app"
  mkdir -p "${CODEX_HOME}/worktrees" "${CODEX_HOME}/sessions" "${CODEX_HOME}/tmp"
fi

cd "$WORKSPACE_DIR"

while [ "$PWD" != "/" ] && [ ! -f "pnpm-workspace.yaml" ]; do
  cd ..
done

if [ ! -f "pnpm-workspace.yaml" ]; then
  echo "Could not find pnpm-workspace.yaml from $WORKSPACE_DIR" >&2
  exit 1
fi

if command -v corepack >/dev/null 2>&1; then
  corepack enable || true
fi

pnpm install
'''

[setup.linux]
script = '''
set -euo pipefail

WORKSPACE_DIR="${CODEX_WORKTREE_PATH:-$PWD}"

if [ "${CODEX_INTERNAL_ORIGINATOR_OVERRIDE:-}" = "Codex Desktop" ]; then
  export CODEX_HOME="${HOME}/.codex-app"
  mkdir -p "${CODEX_HOME}/worktrees" "${CODEX_HOME}/sessions" "${CODEX_HOME}/tmp"
fi

cd "$WORKSPACE_DIR"

while [ "$PWD" != "/" ] && [ ! -f "pnpm-workspace.yaml" ]; do
  cd ..
done

if [ ! -f "pnpm-workspace.yaml" ]; then
  echo "Could not find pnpm-workspace.yaml from $WORKSPACE_DIR" >&2
  exit 1
fi

if command -v corepack >/dev/null 2>&1; then
  corepack enable || true
fi

pnpm install
'''

[[actions]]
name = "Build"
icon = "tool"
command = "pnpm build"

[[actions]]
name = "Run"
icon = "run"
command = "pnpm dev"

[[actions]]
name = "Typecheck"
icon = "tool"
command = "pnpm typecheck"

[[actions]]
name = "Lint"
icon = "tool"
command = "pnpm lint"

[[actions]]
name = "Test"
icon = "test"
command = "pnpm test"
