name: OpenWiki Update (Web)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 */2 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki for web workspace
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-chatgpt
          OPENWIKI_MODEL_ID: gpt-5.4-mini
          OPENAI_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENAI_CHATGPT_ACCESS_TOKEN }}
          OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
          OPENAI_CHATGPT_EXPIRES_AT: ${{ secrets.OPENAI_CHATGPT_EXPIRES_AT }}
          OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
          OPENAI_CHATGPT_EMAIL: ${{ secrets.OPENAI_CHATGPT_EMAIL }}
          OPENAI_CHATGPT_PLAN: ${{ secrets.OPENAI_CHATGPT_PLAN }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Create OpenWiki web update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            apps/web/openwiki
            apps/web/AGENTS.md
            apps/web/CLAUDE.md
            .github/workflows/openwiki-update-web.yml
          branch: openwiki/update-web
          commit-message: "docs: update web OpenWiki"
          title: "docs: update web OpenWiki"
          body: |
            Automated OpenWiki documentation update for apps/web.

            This PR was generated by the scheduled OpenWiki workflow.
